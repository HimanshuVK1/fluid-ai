apiVersion: argocd-image-updater.argoproj.io/v1alpha1
kind: ImageUpdater
metadata:
  name: backend-app-updater
  namespace: argocd
spec:
  writeBackConfig:
    method: "git:secret:git-creds"
    gitConfig:
      branch: "main"
      writeBackTarget: "kustomization"
  applicationRefs:
    - namePattern: "backend-app"
      images:
        - alias: "backend-app"
          imageName: "himanshu369/fastapi-mysql-backend"
          updateStrategy: "latest"
          allowTags: "regexp:^[0-9a-f]{40}$"
          pullSecret: "pullsecret:dockerhub-creds"