apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: argocd-image-updater-app
  namespace: argocd
spec:
  project: default
  source:
    repoURL: 'https://github.com/HimanshuVK1/fluid-ai'
    targetRevision: HEAD
    path: deploy/platform/argocd-image-updator
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
