apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: backend-app
  namespace: argocd
  annotations:
    # 1. Point to the specific mutable tag to track (e.g. :latest)
    argocd-image-updater.argoproj.io/image-list: backend-app=himanshu369/fastapi-mysql-backend:latest

    # 2. Set strategy to digest
    argocd-image-updater.argoproj.io/backend-app.update-strategy: digest

    # 3. Write updates directly to Argo CD in-memory/etcd (NO Git commits/pushes)
    argocd-image-updater.argoproj.io/write-back-method: argocd
spec:
  project: default
  source:
    repoURL: 'https://github.com/HimanshuVK1/fluid-ai'
    targetRevision: main
    path: deploy/services/backend
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: fluid-ai
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true