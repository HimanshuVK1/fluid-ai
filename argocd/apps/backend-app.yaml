apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: backend-app
  namespace: argocd
  annotations:
    # 1. Track the repository without locking to a single tag
    argocd-image-updater.argoproj.io/image-list: backend-app=himanshu369/fastapi-mysql-backend

    # 2. Pick the newest tag matching your 40-char commit SHA regex
    argocd-image-updater.argoproj.io/backend-app.update-strategy: newest-build
    argocd-image-updater.argoproj.io/backend-app.allow-tags: regexp:^[0-9a-f]{40}$
    argocd-image-updater.argoproj.io/backend-app.sort: date

    # 3. Apply the tag directly into Argo CD memory/etcd (NO Git commits or pushes)
    argocd-image-updater.argoproj.io/write-back-method: argocd
spec:
  project: default
  source:
    repoURL: 'https://github.com/HimanshuVK1/fluid-ai'
    targetRevision: main
    path: deploy/services/backend
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: fluid-ai
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true