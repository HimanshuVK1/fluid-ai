apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
	name: kube-prometheus-stack-app
	namespace: argocd
spec:
	project: default
	source:
		repoURL: 'https://github.com/HimanshuVK1/fluid-ai'
		targetRevision: main
		path: deploy/platform/monitoring/kube-prometheus-stack
	destination:
		server: 'https://kubernetes.default.svc'
		namespace: monitoring
	syncPolicy:
		automated:
			prune: true
			selfHeal: true
		syncOptions:
			- CreateNamespace=true

